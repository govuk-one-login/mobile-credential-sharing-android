config:
  validation: true
  warningsAsErrors: false
complexity:
  # Remove the rule for Android Composable functions as they often have many function parameters.
  LongParameterList:
    ignoreAnnotated: ["Composable"]
naming:
  FunctionNaming:
    # Remove the rule for Android Composable functions as they expect TitleCase.
    ignoreAnnotated: ["Composable"]
  PackageNaming:
    # ISO standard numbers require underscores in the package name
    excludes: ["**/iso18013-6-tests/**"]
style:
  ReturnCount:
    excludeGuardClauses: true
  UnusedPrivateMember:
    # Remove the rule for Android Studio's Compose preview functions.
    allowedNames: ".*?Preview"