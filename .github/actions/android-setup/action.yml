name: Android Environment Setup
runs:
  using: "composite"
  steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        lfs: 'true'
        submodules: 'true'
        fetch-depth: 0

    - name: Free disk space
      uses: ./mobile-android-pipelines/actions/clean-runner-fast

    - name: Clean workspace
      uses: ./mobile-android-pipelines/actions/clean-workspace

    - name: Configure git User
      shell: bash
      run: |
        git config user.name github-actions
        git config user.email github-actions@github.com

    - name: Install linux packages
      shell: bash
      run: |
        ./scripts/installLinuxPackages
  

    - name: Setup GitHub Runner workflow
      uses: ./mobile-android-pipelines/actions/setup-runner
      with:
        gradle-cache-disabled: "false"
        jdk-version: "21"

    - name: Install homebrew packages
      shell: bash
      run: |
        brew bundle