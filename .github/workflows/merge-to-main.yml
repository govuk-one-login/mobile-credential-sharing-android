name: Release mobile-credential-sharing-android

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GITHUB_ACTOR: ${{ github.actor }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  bump-version:
    name: "Bump semantic version"
    uses: ./.github/workflows/bump-version.yml
    secrets: inherit
    with:
      # Empty to denote a 'production' release.
      pre-release-type: ''

  dependency-graph:
    name: "Submit gradle dependency graph"
    permissions:
      contents: write
      id-token: write
      packages: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: 'true'
          submodules: 'true'
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/android-setup

      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0


  publish-libraries:
    if: ${{ jobs.bump-version.outputs.current-version != jobs.bump-version.outputs.new-version }}
    needs: bump-version
    permissions:
      contents: write
      id-token: write
      packages: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ jobs.bump-version.outputs.new-version }}
          lfs: 'true'
          submodules: 'true'
          fetch-depth: 0
          fetch-tags: 'true'

      - name: Setup
        uses: ./.github/actions/android-setup

      - name: Publish package
        uses: ./mobile-android-pipelines/actions/maven-publish
        with:
          VERSION_NAME: ${{ steps.versioning.outputs.new_version }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  bump_and_publish:
    if: ${{ jobs.bump-version.outputs.current-version != jobs.bump-version.outputs.new-version }}
    needs: bump-version
    permissions:
      contents: write
      id-token: write
      packages: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ jobs.bump-version.outputs.new-version }}
          lfs: 'true'
          submodules: 'true'
          fetch-depth: 0
          fetch-tags: 'true'

      - name: Setup
        uses: ./.github/actions/android-setup

      - name: Retrieve Secrets
        id: secrets
        uses: ./mobile-android-pipelines/actions/retrieve-secrets
        with:
          keystore-base64: ${{ secrets.KEYSTORE_BASE64 }}
          # No service account needed as we are using Workload Identity Federation
          google-service-account-json-base64: ""

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        id: auth
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: projects/${{ vars.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/deploy-credential-sharing-and/providers/github-actions
          service_account: deploy-credential-sharing-and@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com

      - name: Bundle Demo Release
        id: bundle
        uses: ./mobile-android-pipelines/actions/bundle-release-app
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          keystore-file-path: ${{ steps.secrets.outputs.keystore-file-path }}
          keystore-password: ${{ secrets.KEYSTORE_PASSWORD }}
          keystore-key-alias: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          keystore-key-password: ${{ secrets.KEYSTORE_KEY_PASSWORD}}
          version-code: ${{ steps.versioning.outputs.version-code }}

      - name: Publish to Play Store
        uses: ./mobile-android-pipelines/actions/publish-to-play-store
        with:
          aab-paths: ${{ steps.bundle.outputs.aab-paths }}
          package-name: 'uk.gov.onelogin.sharing.testapp'
          google-service-account-json: ${{ steps.auth.outputs.credentials_file_path }}
          track: 'internal'

      - name: Clean workspace
        uses: ./mobile-android-pipelines/actions/clean-workspace

