name: Test suites

on:
  merge_group:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: testing-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  GITHUB_ACTOR: ${{ github.actor }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

permissions:
  packages: read

jobs:
  contract-debug-tests:
    name: "Contract tests: Debug"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: 'true'
          submodules: 'true'
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/android-setup
        with:
          install-vale: 'false'

      - name: Run contract tests (debug)
        run: |
          ./scripts/test/contract/debug

      - name: Upload contract test coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: contract-debug-test-coverage
          path: |
            **/build/outputs/unit_test_code_coverage/**/*.exec
            **/build/reports/coverage/test/debug/*.xml
            **/build/reports/jacoco/**/*.xml

  unit_tests:
    name: "Unit tests: Debug"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: 'true'
          submodules: 'true'
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/android-setup
        with:
          install-vale: 'false'

      - name: Run unit tests
        # Roborazzi verify is disabled here. Screenshots are recorded on macos and don't match
        # when running on Linux. These are verified by the dedicated `screenshot_tests` job.
        run: |
          ./scripts/test/unit/debug -PskipScreenshotTests

      - name: Upload unit test coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-test-coverage
          path: |
            **/build/outputs/unit_test_code_coverage/**/*.exec
            **/build/reports/coverage/test/debug/*.xml
            **/build/reports/jacoco/**/*.xml

  # https://takahirom.github.io/roborazzi/github-actions.html#add-a-job-to-verify-screenshots
  screenshot_tests:
    name: "Screenshot tests: Debug (macOS)"
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: 'true'
          submodules: 'true'
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@7a6d8a8234af8eb26422e24e3006232cccaa061b # v4.6.0
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Verify screenshots
        run: |
          ./gradlew verifyRoborazziDebug --stacktrace

      - name: Upload screenshot diff report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshot-diff
          path: |
            **/build/outputs/roborazzi/**
            **/build/reports/roborazzi/**

  instrumentation_tests:
    runs-on: ubuntu-latest
    name: "Instrumentation tests: Debug"
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: 'true'
          submodules: 'true'
          fetch-depth: 0

      - name: Setup
        uses: ./mobile-android-pipelines/actions/setup-runner
        with:
          gradle-cache-disabled: "false"
          jdk-version: "21"

      - name: Run instrumentation tests
        run: |
          ./scripts/test/instrumentation/debug --no-configuration-cache

      - name: Upload instrumentation test coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: instrumentation-test-coverage
          path: |
            **/build/outputs/managed_device_code_coverage/**/*.ec
            **/build/reports/coverage/androidTest/**/*.xml

  python_tests:
    name: "Python tests: mock_credential scripts"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[test]"

      - name: Run Python tests
        run: pytest scripts/mock_credential/

  sonar_scan:
    name: "SonarCloud scan"
    runs-on: ubuntu-latest
    needs: [contract-debug-tests, unit_tests, instrumentation_tests, python_tests]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: 'true'
          submodules: 'true'
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/android-setup
        with:
          install-vale: 'false'

      - name: Calculate version increment
        id: calc-version
        uses: ./mobile-android-pipelines/actions/increment-version
        with:
          dry-run: true

      - name: Download unit test coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 #v8.0.2
        with:
          name: unit-test-coverage

      - name: Download contract test coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 #v8.0.2
        with:
          name: contract-debug-test-coverage

      - name: Download instrumentation test coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 #v8.0.2
        with:
          name: instrumentation-test-coverage

      - name: Assemble for Sonar scan
        run: |
          ./scripts/compilePackagesForSonar

      - name: Sonar scan
        uses: ./mobile-android-pipelines/actions/sonar-scan
        with:
          sonar-token: ${{ secrets.SONAR_TOKEN }}
          version-name: ${{ github.ref == 'refs/heads/main' && steps.calc-version.outputs.new_version }}
