name: Test suites

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
  push:
    branches:
      - main
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  GITHUB_ACTOR: ${{ github.actor }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

permissions:
  packages: read

jobs:
  unit_tests:
    name: "Unit test suite"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          lfs: 'true'
          submodules: 'true'
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/android-setup
        with:
          install-vale: 'false'

      - name: Run unit tests
        run: |
          ./scripts/test/unit

      - name: Upload unit test coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-test-coverage
          path: |
            **/build/outputs/unit_test_code_coverage/**/*.exec
            **/build/reports/coverage/test/debug/*.xml
            **/build/reports/jacoco/**/*.xml

  instrumentation_tests:
    name: "Instrumentation test suite"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          lfs: 'true'
          submodules: 'true'
          fetch-depth: 0

      - name: Setup
        uses: ./mobile-android-pipelines/actions/setup-runner
        with:
          gradle-cache-disabled: "false"
          jdk-version: "21"

      - name: Run instrumentation tests
        run: |
          ./scripts/test/instrumentation --no-configuration-cache

      - name: Upload instrumentation test coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: instrumentation-test-coverage
          path: |
            **/build/outputs/managed_device_code_coverage/**/*.ec
            **/build/reports/coverage/androidTest/**/*.xml

  sonar_scan:
    name: "Project sonar scan"
    runs-on: ubuntu-latest
    needs: [unit_tests, instrumentation_tests]
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          lfs: 'true'
          submodules: 'true'
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/android-setup
        with:
          install-vale: 'false'

      - name: Calculate version increment
        id: calc-version
        uses: ./mobile-android-pipelines/actions/increment-version
        with:
          dry-run: true

      - name: Download unit test coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c #v8.0.1
        with:
          name: unit-test-coverage

      - name: Download instrumentation test coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c #v8.0.1
        with:
          name: instrumentation-test-coverage

      - name: Assemble for Sonar scan
        run: |
          ./scripts/compilePackagesForSonar

      - name: Sonar scan
        uses: ./mobile-android-pipelines/actions/sonar-scan
        with:
          sonar-token: ${{ secrets.SONAR_TOKEN }}
          version-name: ${{ github.ref == 'refs/heads/main' && steps.calc-version.outputs.new_version }}
