name: Test suites

on:
  merge_group:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: testing-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  GITHUB_ACTOR: ${{ github.actor }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

permissions:
  packages: read

jobs:
  contract-debug-tests:
    name: "Contract tests: Debug"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: 'true'
          submodules: 'true'
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/android-setup
        with:
          install-vale: 'false'

      - name: Run contract tests (debug)
        run: |
          ./scripts/test/contract/debug

      - name: Upload contract test coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: contract-debug-test-coverage
          path: |
            **/build/outputs/unit_test_code_coverage/**/*.exec
            **/build/reports/coverage/test/debug/*.xml
            **/build/reports/jacoco/**/*.xml

  unit_tests:
    name: "Unit tests: Debug"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: 'true'
          submodules: 'true'
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/android-setup
        with:
          install-vale: 'false'

      - name: Run unit tests
        run: |
          ./scripts/test/unit/debug

      - name: Upload unit test coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-test-coverage
          path: |
            **/build/outputs/unit_test_code_coverage/**/*.exec
            **/build/reports/coverage/test/debug/*.xml
            **/build/reports/jacoco/**/*.xml

  instrumentation_tests:
    runs-on: ubuntu-latest
    name: "Instrumentation tests: Debug"
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: 'true'
          submodules: 'true'
          fetch-depth: 0

      - name: Setup
        uses: ./mobile-android-pipelines/actions/setup-runner
        with:
          gradle-cache-disabled: "false"
          jdk-version: "21"

      - name: Run instrumentation tests
        run: |
          ./scripts/test/instrumentation/debug --no-configuration-cache

      - name: Upload instrumentation test coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: instrumentation-test-coverage
          path: |
            **/build/outputs/managed_device_code_coverage/**/*.ec
            **/build/reports/coverage/androidTest/**/*.xml

  screenshot_tests:
    name: "Screenshot tests: Debug"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: 'true'
          submodules: 'true'
          fetch-depth: 0

      - name: Setup
        uses: ./mobile-android-pipelines/actions/setup-runner
        with:
          gradle-cache-disabled: "false"
          jdk-version: "21"

      - name: Run screenshot tests
        run: |
          ./scripts/screenshot/verify --no-configuration-cache

  python_tests:
    name: "Python tests: mock_credential scripts"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[test]"

      - name: Run Python tests
        run: pytest scripts/mock_credential/

  sonar_scan:
    name: "SonarCloud scan"
    runs-on: ubuntu-latest
    needs: [contract-debug-tests, unit_tests, instrumentation_tests, python_tests, screenshot_tests]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: 'true'
          submodules: 'true'
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/android-setup
        with:
          install-vale: 'false'

      - name: Calculate version increment
        id: calc-version
        uses: ./mobile-android-pipelines/actions/increment-version
        with:
          dry-run: true

      - name: Download unit test coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 #v8.0.2
        with:
          name: unit-test-coverage

      - name: Download contract test coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 #v8.0.2
        with:
          name: contract-debug-test-coverage

      - name: Download instrumentation test coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 #v8.0.2
        with:
          name: instrumentation-test-coverage

      - name: Assemble for Sonar scan
        run: |
          ./scripts/compilePackagesForSonar

      - name: Sonar scan
        uses: ./mobile-android-pipelines/actions/sonar-scan
        with:
          sonar-token: ${{ secrets.SONAR_TOKEN }}
          version-name: ${{ github.ref == 'refs/heads/main' && steps.calc-version.outputs.new_version }}
