# `pipx install -e . --include-deps` installs an editable version of this python project with it's
# necessary dependencies in a managed virtual environment via `pipx`.

# Installs a `generate-mock-credential` command as per [project.scripts].

[build-system]
requires = [
    "setuptools >= 77.0.3",
    "setuptools-git-versioning>=3.0,<4"
]
build-backend = "setuptools.build_meta"

[project]
name = "mobile-credential-sharing-android-python-scripts"
dependencies = [
    "cbor2",
    "cryptography",
    "logging518",
]
dynamic = ["version"]

[project.optional-dependencies]
dev = [
    "black"
]
test = [
    "pytest"
]

[console_scripts]

[project.scripts]
generate-mock-credential = "mock_credential:generate_mock_credential_entry_point"

[tool.black]
line-length = 100
include = "scripts/mock_credential/.*?\\.pyi?$"

[tool.logging]
version = 1
disable_existing_loggers = true

[tool.logging.formatters.formatter]
class = "logging.Formatter"
format = "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

[tool.logging.handlers.ch]
level = "INFO"
class = "logging.StreamHandler"
formatter = "formatter"

[tool.logging.loggers.project]
level = "DEBUG"
handlers = ["ch"]

[tool.pytest]
log_cli = true
log_cli_level = "INFO"
testpaths = [
    "scripts/mock_credential"
]

[tool.setuptools-git-versioning]
enabled = true

[tool.setuptools]
package-dir = {"mock_credential" = "scripts/mock_credential"}
